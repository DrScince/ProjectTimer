appId: com.projecttimer.app
productName: ProjectTimer
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources
    to: .
    filter:
      - 'tray.png'
      - 'icon.png'
      - 'icon.ico'
publish:
  provider: github
  owner: DrScince
  repo: ProjectTimer
  # Öffentliches Release (kein Draft), damit Installer- und Portable-Assets sichtbar sind
  releaseType: release
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
